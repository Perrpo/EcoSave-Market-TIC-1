services:
  backend:
    build:
      context: ./backend-app
    ports:
      - "3333:3333"
    env_file:
      - ./backend-app/.env
    environment:
      - FRONTEND_URL=http://localhost
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-app
      args:
        VITE_API_URL: http://localhost:3333/api/v1
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
